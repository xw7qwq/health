name: Release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The history gate must also see ancestors and tags.
          fetch-depth: 0
      # Host-side checks use only the standard library; the unit tests run inside the built image.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-test-results
          path: |
            test-results/build.log
            test-results/backend-tests.log
            test-results/release-gate.json
          retention-days: 7
